# Windows Cloud RDP - NinjaTrader (no backup / fresh session)
# سرور هر بار تمیز و از نو بالا می‌آید. تنظیمات TLS/ریتمیک، RDP و تیل‌اسکیل حفظ شده‌اند.
# تغییرات داخل سشن (نصب نرم‌افزار و ...) در پایان سشن ذخیره نمی‌شود.


on:
  workflow_dispatch:
  # Auto-restart the session every ~6 hours (chain of sessions).
  schedule:
    - cron: '55 */6 * * *'

# اگر یک سشن در جریان باشد، رانِ جدید در صف می‌ماند تا بعد از پایان آن شروع شود.
concurrency:
  group: nt8-rdp
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 359
    env:
      # Password lives in repo secrets (never visible in public logs).
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: 1. Fix Windows TLS for Rithmic (Rithmic only speaks TLS 1.2)
        run: |
          # Disable TLS 1.3 client (on by default on Server 2022/2025; breaks Rithmic handshake)
          New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Client' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Client' -Name 'Enabled' -Value 0 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Client' -Name 'DisabledByDefault' -Value 1 -Type DWord
          # Make sure TLS 1.2 client is on
          New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Client' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Client' -Name 'Enabled' -Value 1 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Client' -Name 'DisabledByDefault' -Value 0 -Type DWord
          # .NET strong crypto (NinjaTrader is a .NET app -> both registry views)
          foreach ($k in 'HKLM:\SOFTWARE\Microsoft\.NETFramework\v4.0.30319','HKLM:\SOFTWARE\Wow6432Node\Microsoft\.NETFramework\v4.0.30319') {
            Set-ItemProperty -Path $k -Name 'SchUseStrongCrypto' -Value 1 -Type DWord
            Set-ItemProperty -Path $k -Name 'SystemDefaultTlsVersions' -Value 1 -Type DWord
          }
          Write-Host "TLS fix applied: TLS 1.3 client disabled, TLS 1.2 enabled."
          # Rithmic's R|API only negotiates a narrow set of legacy TLS cipher suites.
          $rithmicOrder = @(
            'TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384'
            'TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256'
            'TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384'
            'TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256'
            'TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384'
            'TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256'
            'TLS_RSA_WITH_AES_256_CBC_SHA256'
            'TLS_RSA_WITH_AES_128_CBC_SHA256'
            'TLS_RSA_WITH_AES_256_CBC_SHA'
            'TLS_RSA_WITH_AES_128_CBC_SHA'
          )
          # Server 2025 ships WITHOUT any CBC suites enabled at all; enable them first.
          foreach ($s in $rithmicOrder) {
            try { Enable-TlsCipherSuite -Name $s -ErrorAction Stop } catch { }
          }
          $all = (Get-TlsCipherSuite | ForEach-Object { $_.Name })
          $newOrder = @($rithmicOrder | Where-Object { $all -contains $_ }) + @($all | Where-Object { $rithmicOrder -notcontains $_ })
          # Machine-wide order is set via the Group-Policy registry value (REG_MULTI_SZ "Functions").
          $pk = 'HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002'
          New-Item -Path $pk -Force | Out-Null
          Set-ItemProperty -Path $pk -Name 'Functions' -Value $newOrder -Type MultiString
          Write-Host "Cipher suite order policy written:" -ForegroundColor Green
          $newOrder | Select-Object -First 5 | ForEach-Object { Write-Host "  $_" }
          # Rithmic's market-data gateways (R|API OMNE) still negotiate TLS 1.0/1.1
          # with legacy ciphers (3DES/RC4). Server 2025 ships these disabled, which
          # leaves the connection stuck in "Connecting". Enable client-side legacy TLS:
          foreach ($v in 'TLS 1.0','TLS 1.1') {
            $p = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$v\Client"
            New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name 'Enabled' -Value 1 -Type DWord
            Set-ItemProperty -Path $p -Name 'DisabledByDefault' -Value 0 -Type DWord
          }
          foreach ($s in 'TLS_RSA_WITH_3DES_EDE_CBC_SHA','TLS_RSA_WITH_RC4_128_SHA','TLS_RSA_WITH_RC4_128_MD5','TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA','TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA') {
            try { Enable-TlsCipherSuite -Name $s -ErrorAction Stop } catch { }
          }
          $sch = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL'
          foreach ($c in 'Triple DES 168','Triple DES 112','RC4 128/128','RC2 128/128','DES 56/56') {
            $p = "$sch\Ciphers\$c"; New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name 'Enabled' -Value 0xffffffff -Type DWord
          }
          foreach ($h in 'SHA1','MD5') {
            $p = "$sch\Hashes\$h"; New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name 'Enabled' -Value 0xffffffff -Type DWord
          }
          foreach ($k in 'PKCS','Diffie Hellman','ECDH') {
            $p = "$sch\KeyExchangeAlgorithms\$k"; New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name 'Enabled' -Value 0xffffffff -Type DWord
          }
          Write-Host "Legacy TLS 1.0/1.1 + 3DES/RC4 enabled for Rithmic market-data gateways."

      - name: 2. Enable Remote Desktop, Firewall & session password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          if ([string]::IsNullOrEmpty($Env:RDP_PASSWORD)) {
            throw "Secret RDP_PASSWORD is not set. Add it under repo Settings > Secrets and variables > Actions."
          }
          # Fixed password from repo secret (never printed anywhere).
          # Port 3389 is only reachable inside the user's own Tailscale network.
          net user runneradmin "$Env:RDP_PASSWORD"
          Write-Host "runneradmin password set (not printed)." -ForegroundColor Green
          # RDP is reachable ONLY from inside the Tailscale network (100.64.0.0/10).
          New-NetFirewallRule -DisplayName "RDP via Tailscale TCP" -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow | Out-Null
          New-NetFirewallRule -DisplayName "RDP via Tailscale UDP" -Direction Inbound -Protocol UDP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow | Out-Null
          Write-Host "RDP enabled - Tailscale-only firewall rules created." -ForegroundColor Green

      - name: 3. Connect Tailscale (admin-extract, bypasses broken MSI install)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.3-amd64.msi" -OutFile "C:\tailscale.msi" -UseBasicParsing
          Write-Host "MSI size: $([math]::Round((Get-Item 'C:\tailscale.msi').Length/1MB,1)) MB"
          # 1) administrative extract: pulls files out of the MSI WITHOUT installing (no custom actions)
          $p = Start-Process msiexec -ArgumentList '/a C:\tailscale.msi /qn TARGETDIR=C:\tsadmin' -Wait -PassThru
          Write-Host "admin extract exit: $($p.ExitCode)"
          $exe  = @(Get-ChildItem "C:\tsadmin" -Recurse -Filter "tailscale.exe"  -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          $tsd  = @(Get-ChildItem "C:\tsadmin" -Recurse -Filter "tailscaled.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          $wint = @(Get-ChildItem "C:\tsadmin" -Recurse -Filter "wintun.dll"     -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "extracted: exe=$exe tsd=$tsd wintun=$wint"
          if (-not $exe -or -not $tsd) {
            # 2) normal install for diagnosis - print the REAL failing MSI action
            $p2 = Start-Process msiexec -ArgumentList '/i C:\tailscale.msi /quiet /norestart /lv*C C:\ts-install.log' -Wait -PassThru
            Write-Host "msiexec install exit: $($p2.ExitCode)"
            Write-Host "--- filtered MSI error lines ---"
            Select-String -Path 'C:\ts-install.log' -Pattern 'return value 3','error 3','error code','CustomAction','wintun','Note: 1: 17' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line } | Write-Host
            throw "could not obtain tailscale binaries (see filtered MSI log above)"
          }
          # place wintun.dll next to tailscaled so the driver can load without the installer
          if ($wint) { Copy-Item $wint (Split-Path $tsd) -Force }
          Write-Host "Running tailscaled manually (no MSI service)..."
          Start-Process $tsd -WindowStyle Hidden
          Start-Sleep -Seconds 8
          & $exe up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="nt-server"
          Start-Sleep -Seconds 8
          & $exe status 2>&1 | Write-Host
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Fixed address : nt-server.tail9058f3.ts.net (MagicDNS)" -ForegroundColor Yellow
          Write-Host "  Username      : runneradmin" -ForegroundColor Yellow
          Write-Host "  Password      : stored in repo secret RDP_PASSWORD (fixed)" -ForegroundColor Yellow
          Write-Host "  >> Use your saved RDP shortcut." -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 3b. Refresh MagicDNS name
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = @(Get-ChildItem "C:\tsadmin" -Recurse -Filter "tailscale.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($exe) { & $exe set --hostname="nt-server" 2>&1 | Write-Host }

      - name: 4. Keep alive ~5h20m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "https://api.github.com/repos/$Env:GITHUB_REPOSITORY/contents/.stop-signal"
          for ($i = 1; $i -le 320; $i++) {
            # پایان زودهنگام: اگر فایل .stop-signal در ریپو ساخته شود، سشن حداکثر یک دقیقه بعد سالم تمام می‌شود
            try {
              Invoke-WebRequest -UseBasicParsing -Headers @{ Authorization = "Bearer $Env:GH_TOKEN" } -Uri $uri -ErrorAction Stop | Out-Null
              Write-Host ">>> .stop-signal detected. Ending session early." -ForegroundColor Cyan
              break
            } catch { }
            Start-Sleep -Seconds 60
            Write-Host "[$i/320] Server running... ($([math]::Round($i/60,1))h)"
          }
          Write-Host "Session over. Closing apps so files unlock..."
          Get-Process | Where-Object { $_.ProcessName -like "NinjaTrader*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 20

# ================== راهنما / نکات مهم ==================
#
# 1) رمز ثابت سرور = مقدار Secret رمز پایه (RDP_PASSWORD).
#    آدرس ثابت اتصال = nt-server.tail9058f3.ts.net
#
# 2) پایان زودهنگام سشن: فایل .stop-signal را در ریپو بسازید (یا بگویید «تمام شد»).
#
# 3) ریپوی عمومی = دقیقه نامحدود؛ لاگ‌ها عمومی‌اند ولی هیچ رمز یا IP‌ای در آن‌ها نیست.
